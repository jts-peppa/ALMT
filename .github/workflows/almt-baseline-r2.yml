name: ALMT approved baseline R2

on:
  issues:
    types: [labeled]

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: almt-local-gpu
  cancel-in-progress: false

jobs:
  baseline:
    if: >-
      github.repository == 'jts-peppa/ALMT' &&
      github.event.label.name == 'gpu-approved' &&
      github.actor == 'jts-peppa' &&
      github.event.issue.user.login == 'jts-peppa' &&
      contains(github.event.issue.labels.*.name, 'approved') &&
      contains(github.event.issue.body, 'Experiment Type: ALMT_MOSI_BASELINE_FORMAL_R2') &&
      startsWith(github.event.issue.title, '[ALMT-TASK-')
    runs-on: [self-hosted, Windows, X64, almt-local]
    timeout-minutes: 300

    steps:
      - name: Check out the approved source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Execute or resume the fixed formal baseline
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          HTTP_PROXY: http://127.0.0.1:7897
          HTTPS_PROXY: http://127.0.0.1:7897
        run: >-
          & '.github/scripts/Invoke-AlmtBaselineR2.ps1'
          -EventPath $env:GITHUB_EVENT_PATH
          -ReportPath (Join-Path $env:GITHUB_WORKSPACE 'docs/agent/runs/exp-002.md')

      - name: Update the experiment index and status
        shell: powershell
        run: |
          $indexPath = 'docs/agent/EXPERIMENTS.md'
          $index = Get-Content -LiteralPath $indexPath -Raw
          if ($index -notmatch '(?m)^\| EXP-002 \|') {
            $separator = '|---|---|---|---|---|---|---|---|---|'
            $row = '| EXP-002 | 2026-09-10 | `codex/almt-baseline-seed1111-r2` | see report | Reproduce the frozen ALMT MOSI aligned baseline | MOSI aligned | 1111 | PRELIMINARY | One-seed formal baseline; see exp-002.md |'
            $index = $index.Replace($separator, "$separator`r`n$row")
            Set-Content -LiteralPath $indexPath -Value $index -Encoding utf8
          }
          $statusPath = 'docs/agent/STATUS.md'
          $status = Get-Content -LiteralPath $statusPath -Raw
          $status = [regex]::Replace($status, '(?ms)\r?\n## Latest Automated Baseline.*\z', '')
          $status += "`r`n## Latest Automated Baseline`r`n`r`n- Experiment: EXP-002`r`n- Dataset: MOSI aligned`r`n- Seed: 1111`r`n- Status: PRELIMINARY pending Work review`r`n- Report: docs/agent/runs/exp-002.md`r`n"
          Set-Content -LiteralPath $statusPath -Value $status -Encoding utf8

      - name: Enforce the report-only research diff
        shell: powershell
        run: |
          $allowed = @(
            'docs/agent/EXPERIMENTS.md',
            'docs/agent/STATUS.md',
            'docs/agent/runs/exp-002.md'
          )
          $changed = @(git status --porcelain=v1 --untracked-files=all | ForEach-Object { $_.Substring(3).Replace('\', '/') })
          if ($changed.Count -ne 3 -or @($changed | Where-Object { $_ -notin $allowed }).Count -ne 0) {
            throw "Unexpected R2 changes: $($changed -join '; ')"
          }

      - name: Commit and push the R2 report
        id: push
        shell: powershell
        run: |
          $branch = 'codex/almt-baseline-seed1111-r2'
          git config user.name 'codex-local-runner'
          git config user.email 'codex-local-runner@users.noreply.github.com'
          git switch -c $branch
          git add -- docs/agent/EXPERIMENTS.md docs/agent/STATUS.md docs/agent/runs/exp-002.md
          git commit -m 'exp: record ALMT MOSI baseline seed 1111'
          git push --set-upstream origin $branch
          "branch=$branch" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Create the R2 Draft PR
        id: pr
        shell: powershell
        env:
          TASK_BRANCH: ${{ steps.push.outputs.branch }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          $headers = @{Authorization="Bearer $env:GH_TOKEN";Accept='application/vnd.github+json';'X-GitHub-Api-Version'='2022-11-28';'User-Agent'='ALMT-R2'}
          $payload = @{title='[EXP-002] ALMT MOSI baseline Seed 1111';head=$env:TASK_BRANCH;base=$env:DEFAULT_BRANCH;draft=$true;body="Formal one-seed baseline report for #$env:ISSUE_NUMBER. Test is evaluated once after the fixed 200-epoch schedule using the best-Valid checkpoint."}|ConvertTo-Json
          $pr=Invoke-RestMethod -Method Post -Headers $headers -ContentType 'application/json' -Uri 'https://api.github.com/repos/jts-peppa/ALMT/pulls' -Body $payload
          "node_id=$($pr.node_id)"|Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "url=$($pr.html_url)"|Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Record Issue handoff
        shell: powershell
        env:
          PR_URL: ${{ steps.pr.outputs.url }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          $headers=@{Authorization="Bearer $env:GH_TOKEN";Accept='application/vnd.github+json';'X-GitHub-Api-Version'='2022-11-28';'User-Agent'='ALMT-R2'}
          $payload=@{body="EXP-002 completed; Draft PR: $env:PR_URL"}|ConvertTo-Json
          Invoke-RestMethod -Method Post -Headers $headers -ContentType 'application/json' -Uri "https://api.github.com/repos/jts-peppa/ALMT/issues/$env:ISSUE_NUMBER/comments" -Body $payload|Out-Null

      - name: Mark the completed R2 PR ready
        shell: powershell
        env:
          PR_NODE_ID: ${{ steps.pr.outputs.node_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          $headers=@{Authorization="Bearer $env:GH_TOKEN";Accept='application/vnd.github+json';'User-Agent'='ALMT-R2'}
          $query='mutation($pullRequestId:ID!){markPullRequestReadyForReview(input:{pullRequestId:$pullRequestId}){pullRequest{url isDraft}}}'
          $payload=@{query=$query;variables=@{pullRequestId=$env:PR_NODE_ID}}|ConvertTo-Json -Depth 4
          $response=Invoke-RestMethod -Method Post -Headers $headers -ContentType 'application/json' -Uri 'https://api.github.com/graphql' -Body $payload
          if($response.errors -or $response.data.markPullRequestReadyForReview.pullRequest.isDraft){throw 'Unable to mark R2 PR ready.'}
