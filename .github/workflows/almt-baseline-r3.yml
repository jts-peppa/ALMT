name: ALMT approved baseline R3

on:
  issues:
    types: [labeled]

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  # Non-matching legacy workflows also receive the label event and can cancel a
  # pending run before their job-level `if` is evaluated. Keep R3 dispatch
  # isolated; the runner script separately fails closed when the GPU is busy.
  group: almt-r3-local-gpu
  cancel-in-progress: false

jobs:
  baseline-multiseed:
    if: >-
      github.repository == 'jts-peppa/ALMT' &&
      github.event.label.name == 'gpu-approved' &&
      github.actor == 'jts-peppa' &&
      github.event.issue.user.login == 'jts-peppa' &&
      contains(github.event.issue.labels.*.name, 'approved') &&
      contains(github.event.issue.body, 'Experiment Type: ALMT_MOSI_BASELINE_SEEDS_1112_1113') &&
      startsWith(github.event.issue.title, '[ALMT-TASK-007]')
    runs-on: [self-hosted, Windows, X64, almt-local]
    timeout-minutes: 360

    steps:
      - name: Check out the approved source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Execute or resume Seeds 1112 and 1113
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          HTTP_PROXY: http://127.0.0.1:7897
          HTTPS_PROXY: http://127.0.0.1:7897
        run: >-
          & '.github/scripts/Invoke-AlmtBaselineR3.ps1'
          -EventPath $env:GITHUB_EVENT_PATH
          -ReportPath (Join-Path $env:GITHUB_WORKSPACE 'docs/agent/runs/exp-003.md')

      - name: Update research index and status
        shell: powershell
        run: |
          $head=git rev-parse HEAD
          $indexPath='docs/agent/EXPERIMENTS.md'
          $index=Get-Content $indexPath -Raw
          if($index -notmatch '(?m)^\| EXP-003 \|'){
            $separator='|---|---|---|---|---|---|---|---|---|'
            $row="| EXP-003 | 2026-09-11 | ``codex/almt-baseline-seeds1112-1113-r3`` | ``$head`` | Complete frozen ALMT MOSI three-seed baseline | MOSI aligned | 1111,1112,1113 | PRELIMINARY | See exp-003.md |"
            $index=$index.Replace($separator,"$separator`r`n$row")
            [IO.File]::WriteAllText((Resolve-Path $indexPath),$index,[Text.UTF8Encoding]::new($false))
          }
          $statusPath='docs/agent/STATUS.md'
          $status=Get-Content $statusPath -Raw
          $status=[regex]::Replace($status,'(?ms)\r?\n## Latest Automated Baseline.*\z','')
          $status+="`r`n## Latest Automated Baseline`r`n`r`n- Experiment: EXP-003`r`n- Dataset: MOSI aligned`r`n- Seeds: 1111, 1112, 1113`r`n- Status: PRELIMINARY pending Work review`r`n- Report: docs/agent/runs/exp-003.md`r`n"
          [IO.File]::WriteAllText((Resolve-Path $statusPath),$status,[Text.UTF8Encoding]::new($false))

      - name: Enforce report-only diff
        shell: powershell
        run: |
          $allowed=@('docs/agent/runs/exp-003.md','docs/agent/EXPERIMENTS.md','docs/agent/STATUS.md')
          $changed=@(git status --porcelain=v1 --untracked-files=all | ForEach-Object {$_.Substring(3).Replace('\','/')})
          if($changed.Count -ne 3 -or @($changed|Where-Object{$_ -notin $allowed}).Count){throw "Unexpected R3 changes: $($changed -join '; ')"}

      - name: Commit and push report
        id: push
        shell: powershell
        run: |
          $branch='codex/almt-baseline-seeds1112-1113-r3'
          git config user.name 'codex-local-runner'
          git config user.email 'codex-local-runner@users.noreply.github.com'
          git switch -c $branch
          git add -- docs/agent/runs/exp-003.md docs/agent/EXPERIMENTS.md docs/agent/STATUS.md
          git commit -m 'exp: record ALMT MOSI three-seed baseline'
          git push --set-upstream origin $branch
          "branch=$branch"|Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Create Draft PR
        shell: powershell
        env:
          TASK_BRANCH: ${{ steps.push.outputs.branch }}
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          $h=@{Authorization="Bearer $env:GH_TOKEN";Accept='application/vnd.github+json';'X-GitHub-Api-Version'='2022-11-28';'User-Agent'='ALMT-R3'}
          $p=@{title='[EXP-003] ALMT MOSI three-seed baseline';head=$env:TASK_BRANCH;base='master';draft=$true;body="Seeds 1112/1113 plus frozen EXP-002 Seed 1111 aggregation for #$env:ISSUE_NUMBER. Test was evaluated at most once per new seed."}|ConvertTo-Json
          $pr=Invoke-RestMethod -Method Post -Headers $h -ContentType 'application/json' -Uri 'https://api.github.com/repos/jts-peppa/ALMT/pulls' -Body $p
          $q='mutation($id:ID!){markPullRequestReadyForReview(input:{pullRequestId:$id}){pullRequest{url isDraft}}}'
          $g=@{query=$q;variables=@{id=$pr.node_id}}|ConvertTo-Json -Depth 4
          $ready=Invoke-RestMethod -Method Post -Headers $h -ContentType 'application/json' -Uri 'https://api.github.com/graphql' -Body $g
          if($ready.data.markPullRequestReadyForReview.pullRequest.isDraft){throw 'R3 PR remains Draft.'}
          $c=@{body="EXP-003 completed; PR: $($pr.html_url)"}|ConvertTo-Json
          Invoke-RestMethod -Method Post -Headers $h -ContentType 'application/json' -Uri "https://api.github.com/repos/jts-peppa/ALMT/issues/$env:ISSUE_NUMBER/comments" -Body $c|Out-Null
