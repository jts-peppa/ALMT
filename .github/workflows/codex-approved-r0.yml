name: Codex approved task R0

on:
  issues:
    types: [labeled]

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: almt-codex-local
  cancel-in-progress: false

jobs:
  execute-approved-task:
    if: >-
      github.repository == 'jts-peppa/ALMT' &&
      github.event.label.name == 'approved' &&
      github.actor == 'jts-peppa' &&
      github.event.issue.user.login == 'jts-peppa' &&
      startsWith(github.event.issue.title, '[ALMT-TASK-') &&
      !contains(github.event.issue.body, 'Experiment Type: ALMT_MOSI_BASELINE_SMOKE_R1')
    runs-on: [self-hosted, Windows, X64, almt-local]
    timeout-minutes: 30

    steps:
      - name: Check out the default branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Run the restricted Codex R0 task
        id: codex
        shell: powershell
        run: >-
          & '.github/scripts/Invoke-CodexApprovedR0.ps1'
          -EventPath $env:GITHUB_EVENT_PATH
          -Workspace $env:GITHUB_WORKSPACE
          -OutputPath (Join-Path $env:RUNNER_TEMP 'codex-r0-final.txt')

      - name: Commit and push the R0 documentation changes
        id: push
        shell: powershell
        run: |
          $branch = "codex/almt-task-$($env:ISSUE_NUMBER)-r0"
          git config user.name "codex-local-runner"
          git config user.email "codex-local-runner@users.noreply.github.com"
          git switch -c $branch
          git add -- docs/agent
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            throw 'Codex produced no reviewable docs/agent changes.'
          }
          git commit -m "chore: execute ALMT task #$($env:ISSUE_NUMBER) R0"
          git push --set-upstream origin $branch
          "branch=$branch" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}

      - name: Create the pull request
        id: pr
        shell: powershell
        env:
          TASK_BRANCH: ${{ steps.push.outputs.branch }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          GH_TOKEN: ${{ github.token }}
          HTTP_PROXY: http://127.0.0.1:7897
          HTTPS_PROXY: http://127.0.0.1:7897
        run: |
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
            'User-Agent' = 'ALMT-Codex-R0'
          }
          $payload = @{
            title = "[R0] Execute $env:ISSUE_TITLE"
            head = $env:TASK_BRANCH
            base = $env:DEFAULT_BRANCH
            body = "Restricted self-hosted Codex R0 run for #$env:ISSUE_NUMBER.`n`nOnly docs/agent/** changes are permitted by the runner guard."
            draft = $true
          } | ConvertTo-Json
          $pr = Invoke-RestMethod -Method Post -Headers $headers -ContentType 'application/json' -Uri 'https://api.github.com/repos/jts-peppa/ALMT/pulls' -Body $payload
          "url=$($pr.html_url)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "node_id=$($pr.node_id)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Record the handoff on the task issue
        shell: powershell
        env:
          PR_URL: ${{ steps.pr.outputs.url }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          GH_TOKEN: ${{ github.token }}
          HTTP_PROXY: http://127.0.0.1:7897
          HTTPS_PROXY: http://127.0.0.1:7897
        run: |
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
            'User-Agent' = 'ALMT-Codex-R0'
          }
          $payload = @{ body = "Codex R0 completed and opened a draft PR: $env:PR_URL. The workflow will mark it ready after this handoff record is written." } | ConvertTo-Json
          Invoke-RestMethod -Method Post -Headers $headers -ContentType 'application/json' -Uri "https://api.github.com/repos/jts-peppa/ALMT/issues/$env:ISSUE_NUMBER/comments" -Body $payload | Out-Null

      - name: Mark the completed pull request ready for review
        shell: powershell
        env:
          PR_NODE_ID: ${{ steps.pr.outputs.node_id }}
          GH_TOKEN: ${{ github.token }}
          HTTP_PROXY: http://127.0.0.1:7897
          HTTPS_PROXY: http://127.0.0.1:7897
        run: |
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = 'application/vnd.github+json'
            'User-Agent' = 'ALMT-Codex-R0'
          }
          $query = 'mutation($pullRequestId:ID!){markPullRequestReadyForReview(input:{pullRequestId:$pullRequestId}){pullRequest{url isDraft}}}'
          $payload = @{
            query = $query
            variables = @{ pullRequestId = $env:PR_NODE_ID }
          } | ConvertTo-Json -Depth 4
          $response = Invoke-RestMethod -Method Post -Headers $headers -ContentType 'application/json' -Uri 'https://api.github.com/graphql' -Body $payload
          if ($response.errors) {
            throw "Unable to mark the R0 pull request ready for review: $($response.errors.message -join '; ')"
          }
          if ($response.data.markPullRequestReadyForReview.pullRequest.isDraft) {
            throw 'The R0 pull request is still a draft after the ready mutation.'
          }
