name: Merge reviewed ALMT PR

on:
  pull_request_target:
    types: [labeled]

permissions:
  contents: write
  issues: read
  pull-requests: write

concurrency:
  group: merge-reviewed-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  merge:
    if: >-
      github.repository == 'jts-peppa/ALMT' &&
      github.event.label.name == 'merge-approved' &&
      github.actor == 'jts-peppa' &&
      github.event.pull_request.base.ref == 'master' &&
      github.event.pull_request.head.repo.full_name == 'jts-peppa/ALMT' &&
      (
        github.event.pull_request.user.login == 'jts-peppa' ||
        (
          github.event.pull_request.user.login == 'github-actions[bot]' &&
          startsWith(github.event.pull_request.head.ref, 'codex/almt-gpu-smoke-')
        )
      ) &&
      github.event.pull_request.state == 'open' &&
      github.event.pull_request.draft == false
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Validate the Work review and merge the unchanged PR
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
            'User-Agent' = 'ALMT-Reviewed-Merge'
          }

          $prUri = "https://api.github.com/repos/$env:REPOSITORY/pulls/$env:PR_NUMBER"
          $pr = Invoke-RestMethod -Method Get -Headers $headers -Uri $prUri
          if ($pr.state -ne 'open' -or $pr.draft) { throw 'PR must be open and ready for review.' }
          $ownerAuthored = $pr.user.login -eq 'jts-peppa'
          $trustedRunnerAuthored = (
            $pr.user.login -eq 'github-actions[bot]' -and
            $pr.head.repo.full_name -eq 'jts-peppa/ALMT' -and
            $pr.head.ref -like 'codex/almt-gpu-smoke-*'
          )
          if (-not ($ownerAuthored -or $trustedRunnerAuthored)) { throw 'PR author or source branch is not trusted.' }
          if ($pr.base.ref -ne 'master') { throw 'Only PRs targeting master may be merged.' }
          if ($pr.head.sha -cne $env:EVENT_HEAD_SHA) { throw 'PR head changed after the approval event.' }
          if (-not $pr.mergeable) { throw 'GitHub does not currently consider this PR mergeable.' }

          $commentsUri = "https://api.github.com/repos/$env:REPOSITORY/issues/$env:PR_NUMBER/comments?per_page=100"
          $comments = @(Invoke-RestMethod -Method Get -Headers $headers -Uri $commentsUri)
          $matching = @($comments | Where-Object {
            $_.user.login -eq 'jts-peppa' -and
            $_.author_association -eq 'OWNER' -and
            $_.body -match '<!-- ALMT-RESEARCH-REVIEW -->' -and
            $_.body -match "(?im)^Source PR:\s*#?$env:PR_NUMBER\s*$" -and
            $_.body -match "(?im)^Source Commit:\s*$env:EVENT_HEAD_SHA\s*$" -and
            $_.body -match '(?im)^PR Disposition:\s*MERGE\s*$'
          })
          if ($matching.Count -ne 1) {
            throw "Expected exactly one owner-authored merge review for the current head; found $($matching.Count)."
          }

          $reviewsUri = "https://api.github.com/repos/$env:REPOSITORY/pulls/$env:PR_NUMBER/reviews?per_page=100"
          $reviews = @(Invoke-RestMethod -Method Get -Headers $headers -Uri $reviewsUri)
          $blocking = @($reviews | Where-Object { $_.state -eq 'CHANGES_REQUESTED' -and $_.commit_id -eq $env:EVENT_HEAD_SHA })
          if ($blocking.Count -gt 0) { throw 'The current PR head has a changes-requested review.' }

          $payload = @{ sha = $env:EVENT_HEAD_SHA; merge_method = 'merge' } | ConvertTo-Json
          $result = Invoke-RestMethod -Method Put -Headers $headers -ContentType 'application/json' -Uri "$prUri/merge" -Body $payload
          if (-not $result.merged) { throw "GitHub refused the merge: $($result.message)" }
          Write-Host "Merged PR #$env:PR_NUMBER at reviewed head $env:EVENT_HEAD_SHA."
